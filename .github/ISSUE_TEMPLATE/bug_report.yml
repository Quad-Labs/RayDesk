name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - RayNeo X3 Pro
        - Other (please specify below)
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware Version
      description: "Run: `adb shell getprop ro.build.display.id`"
      placeholder: "e.g., MercuryLiteXR_V1.2.3"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What did you do when the bug occurred?
      placeholder: |
        1. Open RayDesk
        2. Connect to server
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: |
        Reproduce the bug, then immediately run:
        ```bash
        adb logcat -d -s Streaming:V RayDesk:V *:E | tail -200
        ```
        Paste the output below.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots (via scrcpy), video, or any other relevant information.
    validations:
      required: false
